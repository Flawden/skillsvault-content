name: content-integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen hashes and manifests
        run: python tools/verify_content_integrity.py

      - name: Prevent edits/deletes inside existing frozen versions
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" \
            | awk '$1 ~ /^[MD]/ && $2 ~ /\/FROZEN_v[0-9]+\// {print}')"
          if [ -n "$bad" ]; then
            echo "Frozen content was modified/deleted. Create a new FROZEN_vN instead:"
            echo "$bad"
            exit 1
          fi
